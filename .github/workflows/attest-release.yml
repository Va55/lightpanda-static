name: Attest release artifacts

# Creates a Sigstore build-provenance attestation for the files in a release,
# but ONLY after checking that they match the SHA256SUMS committed in this repo.
# That gives users a verifiable chain:
#
#   protected main -> SHA256SUMS -> release asset digest -> attestation -> download
#
# Verify a download with:
#   gh attestation verify <asset> --repo Va55/lightpanda-static
#
# Note: this attests what is published; it does not build the binaries.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attest
        required: true
        default: v1.0.1-main.20261018-r1

permissions:
  contents: read

concurrency:
  group: attest-release
  cancel-in-progress: false

jobs:
  attest:
    name: Verify checksums and attest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write        # Sigstore keyless signing (OIDC)
      attestations: write    # write the attestation to this repo
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Check out the commit carrying SHA256SUMS
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Download the published assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          ls -l dist

      - name: Assets must match the committed checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c "$GITHUB_WORKSPACE/SHA256SUMS"

      - name: Report what will be attested
        run: |
          set -euo pipefail
          sha256sum dist/lightpanda-*-musl

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/lightpanda-*-x86_64-musl
            dist/lightpanda-*-i686-musl
